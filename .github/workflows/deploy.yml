name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing an empty commit.
  workflow_dispatch:

# contents:read to check the repo out; pages + id-token are what
# actions/deploy-pages needs to publish via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. cancel-in-progress is false so a deploy that is already
# publishing finishes rather than being dropped halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Not withastro/action: whenever it detects pnpm it calls
      # pnpm/action-setup with `version: latest`, which clashes with the
      # `"packageManager": "pnpm@11.5.3"` pin in package.json and fails with
      # "Multiple versions of pnpm specified". With no `version` input,
      # pnpm/action-setup reads that pin and nothing else.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node 24: `pnpm prebuild` runs scripts/build-downloads.mjs, which
      # imports a .ts data module and so needs type stripping on by default.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs the prebuild script first, then astro build.
      - name: Build
        run: pnpm build

      - name: Check links
        run: node scripts/check-links.mjs

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
